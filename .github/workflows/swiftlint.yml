# Local copy of StanfordBDHG/.github/.github/workflows/swiftlint.yml@v2 pinned to ubuntu-24.04:
# the SwiftLint Linux binary links against libxml2.so.2, which ubuntu-latest (now Ubuntu 26.04)
# no longer provides. Switch back to the shared workflow once it handles this itself.

name: SwiftLint

on:
  workflow_call:

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SwiftLint
        uses: stanfordbdhg/action-swiftlint@v4
        with:
          args: --strict
