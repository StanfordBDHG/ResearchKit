# Local copy of StanfordBDHG/.github/.github/workflows/swiftlint.yml@v2 with one added step:
# the SwiftLint Linux binary links against libxml2.so.2, which is no longer preinstalled on the
# ubuntu-latest runner image. Switch back to the shared workflow once it installs libxml2 itself.

name: SwiftLint

on:
  workflow_call:

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install libxml2
        run: sudo apt-get update && sudo apt-get install -y libxml2
      - name: SwiftLint
        uses: stanfordbdhg/action-swiftlint@v4
        with:
          args: --strict
